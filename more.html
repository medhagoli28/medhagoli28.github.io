<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>More — Medha Goli</title>
  <meta name="description" content="Skills and hobbies." />
  <meta property="og:title" content="More — Medha Goli" />
  <meta property="og:description" content="Skills and hobbies." />
  <meta property="og:image" content="assets/headshot.jpg" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f6f1e6'/%3E%3Ctext x='50%25' y='58%25' font-family='Georgia,serif' font-weight='700' font-size='38' text-anchor='middle' dominant-baseline='middle' fill='%231c1a15'%3EM%3C/text%3E%3C/svg%3E" />

  <!-- theme is applied before first paint to avoid a flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="more">
  <!-- cursor "coaster" ribbon; drawn every frame by js/trail.js -->
  <canvas id="trail" aria-hidden="true"></canvas>

  <div class="paper">
    <!-- ===== masthead (rendered by js/render.js) ===== -->
    <header class="hero" id="top"></header>

    <!-- ===== sticky nav (one tab per page, from data.pages) ===== -->
    <nav class="navbar" aria-label="Pages">
      <a class="navbrand" href="index.html">Medha Goli</a>
      <div class="navtabs" id="navtabs"></div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span class="theme-label">Dark</span>
      </button>
    </nav>

    <main>
      <section class="section" id="skills"></section>
      <section class="section" id="hobbies"></section>
    </main>

    <footer class="foot" id="foot"></footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
